<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="تسجيل الدخول إلى مَلِك">

    <title>تسجيل الدخول | مَلِك</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <a href="index.html" class="auth-brand">
                <span class="brand-mark">م</span>
                <span class="brand-name">مَلِك</span>
            </a>

            <div class="auth-heading">
                <h1>أهلاً بعودتك 👋</h1>
                <p>سجّل دخولك إلى حسابك في مَلِك</p>
            </div>

            <form id="loginForm" class="auth-form" novalidate>

                <div class="form-group">
                    <label for="loginIdentifier">
                        البريد الإلكتروني أو رقم الهاتف
                    </label>

                    <input
                        type="text"
                        id="loginIdentifier"
                        name="identifier"
                        placeholder="أدخل البريد أو رقم الهاتف"
                        autocomplete="username"
                        required
                    >

                    <small
                        class="form-error"
                        data-error-for="loginIdentifier"
                    ></small>
                </div>


                <div class="form-group">

                    <div class="form-label-row">
                        <label for="loginPassword">
                            كلمة المرور
                        </label>

                        <a href="#" id="forgotPassword">
                            نسيت كلمة المرور؟
                        </a>
                    </div>

                    <div class="password-field">

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="أدخل كلمة المرور"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-password-toggle="loginPassword"
                            aria-label="إظهار كلمة المرور"
                        >
                            👁
                        </button>

                    </div>

                    <small
                        class="form-error"
                        data-error-for="loginPassword"
                    ></small>

                </div>


                <label class="remember-me">

                    <input
                        type="checkbox"
                        name="remember"
                        id="rememberMe"
                    >

                    <span>
                        تذكرني على هذا الجهاز
                    </span>

                </label>


                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                    id="loginSubmit"
                >
                    تسجيل الدخول
                </button>

                <div
                    id="loginMessage"
                    class="auth-message"
                    role="alert"
                    hidden
                ></div>

            </form>


            <div class="auth-divider">
                <span>أو</span>
            </div>


            <div class="auth-register">

                <span>ليس لديك حساب؟</span>

                <a href="register.html">
                    إنشاء حساب جديد
                </a>

            </div>


            <a href="index.html" class="back-home">
                ← العودة إلى الصفحة الرئيسية
            </a>

        </section>

    </main>


    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
